name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # uv is installed with pip so the job only needs the standard GitHub-provided actions.
      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv sync --locked

      - name: Both scripts compile
        run: uv run python -m py_compile weekly_pr_pulse.py ado_readonly_export.py

      # Offline: Azure DevOps is faked, so no PAT or network is needed.
      - name: Tests
        run: uv run pytest -q
